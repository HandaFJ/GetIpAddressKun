# GitHub Pagesへ静的サイトをデプロイするためのワークフロー
name: Deploy static content to Pages

on:
  # mainブランチ（または masterブランチ）にプッシュされたときに自動実行
  push:
    branches: ["main"]

  # GitHub上のActionsタブから手動でも実行できるようにする
  workflow_dispatch:

# GITHUB_TOKEN にPagesへの書き込み権限を付与
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないよう制御
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
